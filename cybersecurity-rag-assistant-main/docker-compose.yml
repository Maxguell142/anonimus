services:

  rag-api:

    build: .

    container_name: cyber-rag-api

    ports:
      - "8000:8000"

    volumes:
      - ./chroma_db:/app/chroma_db

      - ./data:/app/data

    environment:
      OLLAMA_HOST: http://ollama:11434


    depends_on:
      - ollama



  ollama:

    image: ollama/ollama

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama



volumes:

  ollama_data: