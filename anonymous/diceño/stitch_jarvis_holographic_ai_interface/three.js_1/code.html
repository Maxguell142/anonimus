<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Holographic 3D Neural Brain & Quantum Core Simulation for JARVIS
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 24;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Global State Palette Controller
window.jarvisBrain = {
  currentMode: 'normal', // 'normal' | 'attack' | 'defense' | 'completed' | 'error'
  colors: {
    normal: { primary: 0x00f3ff, secondary: 0x0077ff, core: 0x80ffff },
    attack: { primary: 0xbf00ff, secondary: 0x7a00ff, core: 0xff00ea },
    defense: { primary: 0x9400d3, secondary: 0xff0044, core: 0xff1744 },
    completed: { primary: 0x00ff88, secondary: 0x00cc66, core: 0x69ffc3 },
    error: { primary: 0xff0033, secondary: 0xcc0000, core: 0xff5252 }
  },
  pulseSpeed: 1.0,
  rotationMultiplier: 1.0
};

// Create Procedural Brain Geometry with Dual Hemispheres & Neural Synapses
const brainGroup = new THREE.Group();
scene.add(brainGroup);

const particleCount = 1800;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const basePositions = new Float32Array(particleCount * 3);
const scales = new Float32Array(particleCount);

// Generate brain-like dual lobed point cloud
for (let i = 0; i < particleCount; i++) {
  // Hemisphere split: left or right
  const side = i % 2 === 0 ? 1 : -1;
  const u = Math.random();
  const v = Math.random();
  const theta = u * 2.0 * Math.PI;
  const phi = Math.acos(2.0 * v - 1.0);
  
  // Ellipsoid deformed to resemble cerebral hemisphere
  const r = 6.2 * Math.cbrt(Math.random());
  let x = r * Math.sin(phi) * Math.cos(theta);
  let y = r * Math.sin(phi) * Math.sin(theta) * 0.85;
  let z = r * Math.cos(phi) * 1.25;

  // Indent longitudinal fissure (central groove)
  x = (Math.abs(x) * 0.82 + 1.2) * side;
  // Temporal/frontal lobe curvature
  if (z > 0) y *= 0.95;
  if (z < -2) y += 0.8;

  positions[i * 3] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  basePositions[i * 3] = x;
  basePositions[i * 3 + 1] = y;
  basePositions[i * 3 + 2] = z;

  scales[i] = Math.random() * 0.8 + 0.4;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

// Particle Texture
const canvas = document.createElement('canvas');
canvas.width = 64;
canvas.height = 64;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
grad.addColorStop(0.25, 'rgba(0, 240, 255, 0.8)');
grad.addColorStop(0.7, 'rgba(0, 100, 255, 0.2)');
grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 64, 64);
const pTexture = new THREE.CanvasTexture(canvas);

const pMaterial = new THREE.PointsMaterial({
  color: 0x00f3ff,
  size: 0.75,
  map: pTexture,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(geometry, pMaterial);
brainGroup.add(particleSystem);

// Holographic Synaptic Connecting Lines
const lineMaterial = new THREE.LineBasicMaterial({
  color: 0x00f3ff,
  transparent: true,
  opacity: 0.25,
  blending: THREE.AdditiveBlending
});

const linePositions = [];
for (let i = 0; i < particleCount; i += 7) {
  for (let j = i + 1; j < Math.min(i + 15, particleCount); j += 2) {
    const dx = positions[i * 3] - positions[j * 3];
    const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
    const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist < 2.6) {
      linePositions.push(
        positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2],
        positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]
      );
    }
  }
}
const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const neuralLines = new THREE.LineSegments(lineGeometry, lineMaterial);
brainGroup.add(neuralLines);

// Holographic Orbital Rings (Arc Reactor/JARVIS Ring Shield)
const ringGroup = new THREE.Group();
scene.add(ringGroup);

function createHoloRing(radius, tube, rotX, rotY, colorVal) {
  const ringGeo = new THREE.TorusGeometry(radius, tube, 8, 90);
  const ringMat = new THREE.MeshBasicMaterial({
    color: colorVal,
    transparent: true,
    opacity: 0.45,
    wireframe: true,
    blending: THREE.AdditiveBlending
  });
  const mesh = new THREE.Mesh(ringGeo, ringMat);
  mesh.rotation.x = rotX;
  mesh.rotation.y = rotY;
  ringGroup.add(mesh);
  return mesh;
}

const ring1 = createHoloRing(10.5, 0.08, Math.PI / 2.3, 0.2, 0x00f3ff);
const ring2 = createHoloRing(12.0, 0.05, -Math.PI / 3, 0.4, 0x0088ff);
const ring3 = createHoloRing(8.8, 0.06, 0.8, -0.6, 0x00f3ff);

// Central Pulsing Energy Core
const coreGeo = new THREE.SphereGeometry(1.6, 24, 24);
const coreMat = new THREE.MeshBasicMaterial({
  color: 0x80ffff,
  wireframe: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// Ambient subtle floating nodes
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const state = window.jarvisBrain;
  const currentPalette = state.colors[state.currentMode] || state.colors.normal;

  // Smooth Color Lerping
  pMaterial.color.lerp(new THREE.Color(currentPalette.primary), 0.05);
  lineMaterial.color.lerp(new THREE.Color(currentPalette.secondary), 0.05);
  ring1.material.color.lerp(new THREE.Color(currentPalette.primary), 0.05);
  ring2.material.color.lerp(new THREE.Color(currentPalette.secondary), 0.05);
  ring3.material.color.lerp(new THREE.Color(currentPalette.core), 0.05);
  coreMat.color.lerp(new THREE.Color(currentPalette.core), 0.05);

  // Speed and dynamics
  let speedMultiplier = 1.0;
  if (state.currentMode === 'attack') speedMultiplier = 2.4;
  else if (state.currentMode === 'defense') speedMultiplier = 1.8;
  else if (state.currentMode === 'error') speedMultiplier = 0.6;
  else if (state.currentMode === 'completed') speedMultiplier = 1.2;

  // Gentle Brain Rotation & Breathing
  brainGroup.rotation.y = t * 0.22 * speedMultiplier;
  brainGroup.rotation.x = Math.sin(t * 0.3) * 0.12;

  // Ring Gyroscope rotations
  ring1.rotation.z += 0.008 * speedMultiplier;
  ring2.rotation.y += 0.005 * speedMultiplier;
  ring3.rotation.x -= 0.007 * speedMultiplier;

  // Core pulse scale
  const pulse = Math.sin(t * 3.5 * speedMultiplier) * 0.25 + 1.0;
  coreMesh.scale.set(pulse, pulse, pulse);

  // Synaptic point breathing & energy wave pass
  const posArr = geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    const bx = basePositions[i * 3];
    const by = basePositions[i * 3 + 1];
    const bz = basePositions[i * 3 + 2];
    
    // traveling wave along y & z axis
    const wave = Math.sin(t * 4.0 * speedMultiplier + by * 0.8 + bz * 0.5) * 0.15;
    posArr[i * 3] = bx * (1.0 + wave);
    posArr[i * 3 + 1] = by * (1.0 + wave);
    posArr[i * 3 + 2] = bz * (1.0 + wave);
  }
  geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
